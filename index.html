<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="감량체크">
  <meta name="description" content="오늘의 운동을 한 종목씩. 운동과 체중을 간편하게 기록하는 12주 트레이너.">
  <title>Project 100 · 12주 감량 트레이너</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles/app.css">
</head>
<body>
  <div class="shell">
    <header class="topbar"><a href="./" aria-label="Project 100 처음으로" class="brand">project<span>100</span><i></i></a><button type="button" class="icon-button" id="settingsButton" aria-label="설정"></button></header>
    <div id="saveNotice" class="notice error-notice" role="alert" hidden></div>
    <div id="updateNotice" class="notice" hidden><span>새 버전이 준비됐어요.</span><button type="button" id="updateApp" class="text-button">지금 적용</button></div>
    <main id="app"><section class="card"><h1>오늘의 운동을 준비하고 있어요</h1><p class="muted">잠시만 기다려 주세요.</p></section></main>
    <noscript>이 앱을 사용하려면 JavaScript를 켜 주세요.</noscript>
  </div>
  <nav class="bottom-nav" aria-label="주요 메뉴">
    <button type="button" data-nav="today" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="4"/><path d="M8 3v4m8-4v4M4 11h16m-11 5 2 2 4-4"/></svg><span>오늘</span></button>
    <button type="button" data-nav="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>계획</span></button>
    <button type="button" data-nav="record"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16h16M7 14l4-4 4 2 5-7"/></svg><span>기록</span></button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="installHelp"><h2>홈 화면에서 사용하기</h2><p id="installText"></p><button type="button" class="secondary" id="closeInstall">확인</button></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
